name: Atualizar estatísticas do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: cards-do-perfil
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o repositório do perfil
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Auditar dados e gerar os painéis preservando o layout
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          REQUIRED_PRIVATE_REPOS: ${{ vars.STATS_REQUIRED_PRIVATE_REPOS || 'brasaliment/sistema-eventos' }}
        run: |
          python3 - <<'PY'
          """Estatísticas verificáveis. Python 3.12+, somente biblioteca padrão.
          
          Não imprime nomes privados, mensagens de commit, e-mails ou tokens.
          Os SVGs existentes são modelos visuais; todos os números são substituídos.
          """
          
          import json
          import math
          import os
          import re
          import sys
          import time
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          
          NS = "http://www.w3.org/2000/svg"
          ET.register_namespace("", NS)
          ET.register_namespace("xlink", "http://www.w3.org/1999/xlink")
          USER = "lucasitdias"
          LANGUAGE_WINDOW_DAYS = 180
          OUT = Path("assets/stats")
          API_VERSION = "2022-11-28"
          FORMULA = "https://github.com/stats-organization/github-readme-stats/blob/d79be7a9fd50ce38aef89306c8a1185fc0443bc7/src/calculateRank.js"
          
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def integer(value):
              require(type(value) is int and value >= 0, "A API retornou um inteiro inválido.")
              return value
          
          
          class API:
              def __init__(self):
                  self.token = os.environ.get("PROFILE_STATS_TOKEN", "")
                  require(bool(self.token), "Configure o secret PROFILE_STATS_TOKEN.")
                  self.requests = 0
          
              def get(self, path, payload=None, allow_empty=False):
                  for attempt in range(3):
                      request = Request(
                          "https://api.github.com" + path,
                          data=json.dumps(payload).encode() if payload is not None else None,
                          headers={
                              "Authorization": "Bearer " + self.token,
                              "Accept": "application/vnd.github+json",
                              "X-GitHub-Api-Version": API_VERSION,
                              "Content-Type": "application/json",
                              "User-Agent": "lucasitdias-profile-audit",
                          },
                      )
                      self.requests += 1
                      try:
                          with urlopen(request, timeout=45) as response:
                              require(not response.headers.get("X-GitHub-SSO"), "Acesso SSO parcial; publicação bloqueada.")
                              data = json.load(response)
                              headers = dict(response.headers)
                          require(not isinstance(data, dict) or not data.get("errors"), "A consulta GraphQL retornou erros.")
                          return data, headers
                      except HTTPError as error:
                          # Apenas o erro documentado de repositório vazio é aceito.
                          if allow_empty and error.code == 409:
                              detail = json.loads(error.read())
                              if "empty" in detail.get("message", "").lower():
                                  return [], {}
                          if error.code in (502, 503, 504) and attempt < 2:
                              time.sleep(2 ** attempt)
                              continue
                          raise RuntimeError(f"Consulta obrigatória falhou: HTTP {error.code}. Nenhum painel será publicado.") from None
                      except URLError:
                          if attempt == 2:
                              raise RuntimeError("Falha de rede após três tentativas.") from None
                          time.sleep(2 ** attempt)
                  raise RuntimeError("Consulta não concluída.")
          
              def pages(self, path, params=None, allow_empty=False):
                  result = []
                  fingerprints = set()
                  for page in range(1, 10001):
                      query = dict(params or {}, per_page=100, page=page)
                      batch, _ = self.get(path + "?" + urlencode(query), allow_empty=allow_empty)
                      require(isinstance(batch, list), "Página da API inválida.")
                      if batch:
                          fingerprint = json.dumps(batch, sort_keys=True)
                          require(fingerprint not in fingerprints, "Paginação repetida; publicação bloqueada.")
                          fingerprints.add(fingerprint)
                      result.extend(batch)
                      if len(batch) < 100:
                          return result
                  raise RuntimeError("Limite defensivo da paginação atingido; resultado incompleto.")
          
              def graphql(self, query, variables):
                  data, _ = self.get("/graphql", {"query": query, "variables": variables})
                  require(isinstance(data, dict) and data.get("data"), "GraphQL sem dados.")
                  return data["data"]
          
          
          def repository_inventory(api):
              repos = api.pages("/user/repos", {
                  "visibility": "all", "affiliation": "owner,collaborator,organization_member",
                  "sort": "full_name", "direction": "asc",
              })
              ids = [repo["id"] for repo in repos]
              require(len(ids) == len(set(ids)), "Inventário mudou durante a paginação.")
              return {repo["full_name"].lower(): repo for repo in repos}
          
          
          def branch_snapshot(api, repo):
              branches = api.pages("/repos/" + repo + "/branches", allow_empty=True)
              names = [branch["name"] for branch in branches]
              require(len(names) == len(set(names)), "Branches duplicadas na paginação.")
              return {branch["name"]: branch["commit"]["sha"] for branch in branches}
          
          
          def commit_set(api, repo, heads, recent_from=None, recent_to=None, active_repos=None):
              # Consulta pelo SHA imutável, não por uma branch que pode avançar.
              seen = set()
              owned = set()
              unmatched = set()
              for head in sorted(set(heads.values())):
                  commits = api.pages("/repos/" + repo + "/commits", {"sha": head})
                  require(bool(commits), "Uma branch não retornou seu histórico.")
                  for commit in commits:
                      sha = commit["sha"]
                      require(bool(re.fullmatch(r"[0-9a-f]{40,64}", sha)), "SHA inválido.")
                      seen.add(sha)
                      author = commit.get("author")
                      if author and author.get("login", "").lower() == USER:
                          owned.add(sha)
                          if recent_from is not None:
                              value = commit.get("commit", {}).get("author", {}).get("date")
                              require(isinstance(value, str), "Commit atribuído à conta sem data de autoria; publicação bloqueada.")
                              timestamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
                              require(timestamp.tzinfo is not None, "Data de autoria sem fuso horário.")
                              if recent_from <= timestamp <= recent_to:
                                  active_repos.add(repo)
                      elif author is None:
                          unmatched.add(sha)
              return owned, seen, unmatched
          
          
          def language_totals(api, repos, all_repositories=False):
              totals = Counter()
              checked = 0
              for repo in repos:
                  if not all_repositories and (repo["owner"]["login"].lower() != USER or repo["fork"]):
                      continue
                  data, _ = api.get("/repos/" + repo["full_name"] + "/languages")
                  require(isinstance(data, dict), "Resposta de linguagens inválida.")
                  for name, size in data.items():
                      totals[name] += integer(size)
                  checked += 1
              return totals, checked
          
          
          def language_totals_graphql(api, repos):
              totals = Counter()
              for repo in repos:
                  owner, name = repo["full_name"].split("/", 1)
                  cursor = None
                  seen_cursors = set()
                  seen_languages = set()
                  while True:
                      data = api.graphql("""query($owner:String!, $name:String!, $cursor:String) {
                        repository(owner:$owner,name:$name) {
                          languages(first:100,after:$cursor) {
                            pageInfo {hasNextPage endCursor} edges {size node {name}}
                          }
                        }
                      }""", {"owner": owner, "name": name, "cursor": cursor})
                      require(data.get("repository") is not None, "Repositório selecionado não retornado pelo GraphQL.")
                      languages = data["repository"]["languages"]
                      for item in languages["edges"]:
                          language = item["node"]["name"]
                          require(language not in seen_languages, "Linguagem repetida na paginação GraphQL.")
                          seen_languages.add(language)
                          totals[language] += integer(item["size"])
                      info = languages["pageInfo"]
                      if not info["hasNextPage"]:
                          break
                      cursor = info["endCursor"]
                      require(cursor and cursor not in seen_cursors, "Cursor de linguagens repetido ou inválido.")
                      seen_cursors.add(cursor)
              return totals
          
          
          def calendar(api, created_at, now):
              query = """query($login:String!, $from:DateTime!, $to:DateTime!) {
                user(login:$login) { contributionsCollection(from:$from,to:$to) {
                  contributionCalendar { totalContributions weeks {
                    contributionDays { date contributionCount }
                  } }
                } }
              }"""
              first = datetime.fromisoformat(created_at.replace("Z", "+00:00")).date()
              daily = {}
              years = []
              for year in range(first.year, now.year + 1):
                  start = max(first, date(year, 1, 1))
                  finish = min(now.date(), date(year, 12, 31))
                  from_time = datetime.combine(start, datetime.min.time(), timezone.utc)
                  to_time = min(now, datetime.combine(finish, datetime.max.time(), timezone.utc))
                  variables = {"login": USER, "from": from_time.isoformat(), "to": to_time.isoformat()}
                  data = api.graphql(query, variables)["user"]["contributionsCollection"]["contributionCalendar"]
                  entries = {}
                  for week in data["weeks"]:
                      for item in week["contributionDays"]:
                          day = date.fromisoformat(item["date"])
                          if start <= day <= finish:
                              require(day not in entries, "Dia duplicado no calendário.")
                              entries[day] = integer(item["contributionCount"])
                  require(len(entries) == (finish - start).days + 1, "Faltam dias no calendário retornado.")
                  require(sum(entries.values()) == integer(data["totalContributions"]), "O total anual diverge da soma dos dias.")
                  require(not set(entries) & set(daily), "Sobreposição de anos no calendário.")
                  daily.update(entries)
                  years.append({"year": year, "from": start.isoformat(), "to": finish.isoformat(), "total": sum(entries.values())})
              return daily, years
          
          
          def streaks(daily, today):
              # Hoje sem atividade não encerra a sequência iniciada até ontem.
              active = sorted(day for day, count in daily.items() if count > 0)
              best = (0, None, None)
              length = 0
              begin = previous = None
              for day in active:
                  if previous is not None and day == previous + timedelta(days=1):
                      length += 1
                  else:
                      begin, length = day, 1
                  if length > best[0]:
                      best = (length, begin, day)
                  previous = day
              end = today if daily.get(today, 0) else today - timedelta(days=1)
              cursor = end
              current = 0
              while daily.get(cursor, 0) > 0:
                  current += 1
                  cursor -= timedelta(days=1)
              return {
                  "total": sum(daily.values()),
                  "first_activity": active[0].isoformat() if active else None,
                  "current": current,
                  "current_from": (cursor + timedelta(days=1)).isoformat() if current else None,
                  "current_to": end.isoformat() if current else None,
                  "longest": best[0],
                  "longest_from": best[1].isoformat() if best[1] else None,
                  "longest_to": best[2].isoformat() if best[2] else None,
              }
          
          
          def rank(metrics, reviews, followers):
              inputs = dict(metrics)
              inputs.update(reviews=reviews, followers=followers)
              weighted = (
                  2 * (1 - 2 ** (-metrics["commits"] / 1000))
                  + 3 * (1 - 2 ** (-metrics["prs"] / 50))
                  + (1 - 2 ** (-metrics["issues"] / 25))
                  + (1 - 2 ** (-reviews / 2))
                  + 4 * metrics["stars"] / (metrics["stars"] + 50)
                  + followers / (followers + 10)
              )
              score = (1 - weighted / 12) * 100
              levels = zip([1, 12.5, 25, 37.5, 50, 62.5, 75, 87.5, 100], ["S", "A+", "A", "A-", "B+", "B", "B-", "C+", "C"])
              return {"level": next(name for limit, name in levels if score <= limit), "formula_score": score,
                      "inputs": inputs, "formula_source": FORMULA,
                      "note": "Fórmula do gerador com commits únicos das branches auditadas; não é nota oficial do GitHub nem avaliação profissional."}
          
          
          def one(root, attribute, value):
              items = [e for e in root.iter() if e.get(attribute) == value]
              require(len(items) == 1, "Modelo visual incompatível: " + value)
              return items[0]
          
          
          def set_text(element, text):
              for child in list(element):
                  element.remove(child)
              element.text = str(text)
          
          
          def tag(name):
              return "{" + NS + "}" + name
          
          
          def date_br(value):
              return date.fromisoformat(value).strftime("%d/%m/%Y") if value else "Sem atividade"
          
          
          def date_range(start, finish):
              if start is None:
                  return "Sem sequência"
              return date_br(start) + " – " + date_br(finish)
          
          
          def draw_stats(root, report):
              for element in list(root):
                  if element.get("id") == "audit-static-style":
                      root.remove(element)
              ET.SubElement(root, tag("style"), {"id": "audit-static-style"}).text = ".stagger,.header,.rank-text{opacity:1;animation:none}"
              for name, value in report["metrics"].items():
                  node = one(root, "data-testid", name)
                  set_text(node, value)
                  if name in ("commits", "contribs"):
                      parent = next(p for p in root.iter() if node in list(p))
                      texts = [e for e in parent if e.tag == tag("text") and e is not node]
                      require(len(texts) == 1, "Rótulo não identificado.")
                      texts[0].text = "Commits nas branches:" if name == "commits" else "Repos. contribuídos:"
                      texts[0].attrib.pop("style", None)
              rank_group = one(root, "data-testid", "rank-circle")
              rank_group.attrib.pop("display", None)
              rank_group.attrib.pop("style", None)
              rank_text = one(root, "data-testid", "level-rank-icon")
              set_text(rank_text, report["rank_validation"]["level"])
              rank_text.set("x", "-10")
              rank_text.set("y", "8")
              rank_text.set("text-anchor", "middle")
              rank_text.set("dominant-baseline", "central")
              for e in root.iter(tag("circle")):
                  if e.get("class") == "rank-circle":
                      circumference = 2 * math.pi * 40
                      e.set("style", f"animation:none;stroke-dasharray:{circumference};stroke-dashoffset:{circumference * report['rank_validation']['formula_score'] / 100};transform-origin:-10px 8px;transform:rotate(-90deg)")
              desc = root.find(tag("desc"))
              require(desc is not None, "Descrição acessível ausente.")
              set_text(desc, json.dumps(report["metrics"], ensure_ascii=False) + " Rank " + report["rank_validation"]["level"])
          
          
          COLORS = {"TypeScript": "#3178c6", "JavaScript": "#f1e05a", "Python": "#3572A5", "Java": "#b07219",
                    "HTML": "#e34c26", "CSS": "#663399", "C": "#555555", "CMake": "#DA3434",
                    "Shell": "#89e051", "Dockerfile": "#384d54", "PLpgSQL": "#336790"}
          
          
          def draw_languages(root, totals):
              # Conserva dimensões, cabeçalho, cores, barra e duas colunas do modelo.
              container = one(root, "data-testid", "lang-items")
              container.clear()
              container.set("data-testid", "lang-items")
              container.set("x", "25")
              mask = ET.SubElement(container, tag("mask"), {"id": "rect-mask"})
              ET.SubElement(mask, tag("rect"), {"x": "0", "y": "0", "width": "250", "height": "8", "fill": "white", "rx": "5"})
              selected = sorted(((n, b) for n, b in totals.items() if b > 0), key=lambda x: (-x[1], x[0]))[:8]
              denominator = sum(b for _, b in selected)
              if denominator == 0:
                  node = ET.SubElement(container, tag("text"), {"x": "0", "y": "35", "class": "lang-name"})
                  node.text = "Sem código detectado nos projetos do período."
              one(root, "data-testid", "header").text = "Linguagens · 180 dias"
              rows = []
              x = 0.0
              for index, (name, size) in enumerate(selected):
                  percentage = size / denominator * 100
                  color = COLORS.get(name, "#8b949e")
                  width = 250 * size / denominator
                  ET.SubElement(container, tag("rect"), {"data-testid": "lang-progress", "mask": "url(#rect-mask)", "x": str(x), "y": "0", "width": str(width), "height": "8", "fill": color})
                  x += width
                  column, row = divmod(index, 4)
                  group = ET.SubElement(container, tag("g"), {"transform": f"translate({column * 150},{25 + row * 25})"})
                  ET.SubElement(group, tag("circle"), {"cx": "5", "cy": "6", "r": "5", "fill": color})
                  node = ET.SubElement(group, tag("text"), {"data-testid": "lang-name", "data-language": name, "x": "15", "y": "10", "class": "lang-name"})
                  node.text = f"{name} {percentage:.2f}%"
                  rows.append({"name": name, "bytes": size, "percentage": round(percentage, 2)})
              description = root.find(tag("desc"))
              require(description is not None, "Modelo de linguagens sem descrição.")
              description.text = "Bytes atuais das oito linguagens exibidas nos projetos acessíveis com commits de autoria principal associados a lucasitdias nos últimos 180 dias. Inclui projetos próprios e de outras contas, públicos, privados e forks. O código pode ter sido escrito pela equipe e fora desse período; não mede autoria individual."
              return rows
          
          
          def streak_node(root, transform):
              group = one(root, "transform", transform)
              nodes = group.findall(tag("text"))
              require(len(nodes) == 1, "Modelo da sequência incompatível.")
              return nodes[0]
          
          
          def draw_streak(root, data, now):
              for transform in ("translate(82.5, 84)", "translate(412.5, 84)"):
                  streak_node(root, transform).set("y", "56")
              values = {
                  "translate(82.5, 48)": data["total"],
                  "translate(247.5, 48)": data["current"],
                  "translate(412.5, 48)": data["longest"],
                  "translate(247.5, 145)": date_range(data["current_from"], data["current_to"]),
                  "translate(412.5, 114)": date_range(data["longest_from"], data["longest_to"]),
              }
              for transform, value in values.items():
                  node = streak_node(root, transform)
                  set_text(node, value)
                  if " – " in str(value) or value == "Sem sequência":
                      node.set("font-size", "10px")
                      node.set("y", "32")
              # As três datas usam a mesma linha de base, fonte e formato.
              for transform in ("translate(82.5, 114)", "translate(247.5, 145)", "translate(412.5, 114)"):
                  node = streak_node(root, transform)
                  node.set("y", "52" if transform != "translate(247.5, 145)" else "21")
                  node.set("font-size", "10px")
              node = streak_node(root, "translate(82.5, 114)")
              set_text(node, date_range(data["first_activity"], now.date().isoformat()))
              ET.SubElement(root, tag("desc")).text = "Dias do calendário do GitHub em UTC. Hoje sem contribuição preserva a sequência de ontem. Em empate, maior sequência mais antiga."
          
          
          def validate_rendered(roots, report, totals, daily, today):
              for name, expected in report["metrics"].items():
                  require(int(one(roots["stats.svg"], "data-testid", name).text) == expected, "SVG diverge da auditoria: " + name)
              actual_rank = one(roots["stats.svg"], "data-testid", "level-rank-icon").text
              require(actual_rank == report["rank_validation"]["level"], "Rank do SVG divergente.")
              chosen = sorted(((n, b) for n, b in totals.items() if b), key=lambda pair: (-pair[1], pair[0]))[:8]
              denominator = sum(size for _, size in chosen)
              nodes = [e for e in roots["top-langs.svg"].iter() if e.get("data-testid") == "lang-name"]
              require(len(nodes) == len(chosen), "Linguagens ausentes no SVG.")
              for node, (name, size) in zip(nodes, chosen):
                  require(node.text == f"{name} {100 * size / denominator:.2f}%", "Percentual de linguagem divergente.")
              bars = [e for e in roots["top-langs.svg"].iter() if e.get("data-testid") == "lang-progress"]
              require(abs(sum(float(e.get("width")) for e in bars) - (250 if denominator else 0)) < 1e-7, "Barra de linguagens divergente.")
              # Segunda implementação para conferir sequências e datas.
              runs = []
              begin = end = None
              for day in sorted(daily):
                  if daily[day] > 0:
                      if begin is None:
                          begin = day
                      end = day
                  elif begin is not None:
                      runs.append((begin, end))
                      begin = end = None
              if begin is not None:
                  runs.append((begin, end))
              best = max(runs, key=lambda pair: (pair[1] - pair[0]).days, default=None)
              current = next((pair for pair in reversed(runs) if pair[1] >= today - timedelta(days=1)), None)
              data = report["streak"]
              for key, run in [("current", current), ("longest", best)]:
                  require(data[key] == ((run[1] - run[0]).days + 1 if run else 0), "Sequências divergentes.")
                  require(data[key + "_from"] == (run[0].isoformat() if run else None), "Data inicial divergente.")
                  require(data[key + "_to"] == (run[1].isoformat() if run else None), "Data final divergente.")
              for transform, expected in [("translate(82.5, 48)", data["total"]), ("translate(247.5, 48)", data["current"]), ("translate(412.5, 48)", data["longest"])]:
                  require(int(streak_node(roots["streak.svg"], transform).text) == expected, "Número da sequência divergente no SVG.")
              require(streak_node(roots["streak.svg"], "translate(247.5, 145)").text == date_range(data["current_from"], data["current_to"]), "Data atual divergente no SVG.")
              require(streak_node(roots["streak.svg"], "translate(412.5, 114)").text == date_range(data["longest_from"], data["longest_to"]), "Data histórica divergente no SVG.")
              require(streak_node(roots["streak.svg"], "translate(82.5, 114)").text == date_range(data["first_activity"], today.isoformat()), "Intervalo total divergente no SVG.")
          
          
          """Troféus e badges locais derivados exclusivamente da auditoria.
          
          Os ícones e os limites das classificações são adaptados de
          ryo-ma/github-profile-trophy, versão fixada em TROPHY_SOURCE.
          """
          import base64
          import gzip
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from zoneinfo import ZoneInfo
          
          TROPHY_SOURCE = "https://github.com/ryo-ma/github-profile-trophy/tree/43736b50a82fca73c8df1c81abb40aa03519975c"
          TROPHY_LICENSE = """Copyright (c) 2020 ryo-ma
          
          Permission is hereby granted, free of charge, to any person obtaining
          a copy of this software and associated documentation files (the
          "Software"), to deal in the Software without restriction, including
          without limitation the rights to use, copy, modify, merge, publish,
          distribute, sublicense, and/or sell copies of the Software, and to
          permit persons to whom the Software is furnished to do so, subject to
          the following conditions:
          
          The above copyright notice and this permission notice shall be
          included in all copies or substantial portions of the Software.
          
          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,
          EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF
          MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND
          NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE
          LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION
          OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION
          WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
          """
          
          PROFILE_NS = "http://www.w3.org/2000/svg"
          
          
          def profile_require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def profile_tag(name):
              return "{" + PROFILE_NS + "}" + name
          
          
          def profile_one(root, attribute, value):
              items = [e for e in root.iter() if e.get(attribute) == value]
              profile_require(len(items) == 1, "Elemento de perfil ausente ou duplicado: " + value)
              return items[0]
          
          
          # Todas as condições do gerador original para estas seis categorias.
          TROPHY_RULES = {
              "Commits": [(1,"C","First Commit"),(10,"B","Middle Committer"),(100,"A","High Committer"),(200,"AA","Hyper Committer"),(500,"AAA","Ultra Committer"),(1000,"S","Super Committer"),(2000,"SS","Deep Committer"),(4000,"SSS","God Committer")],
              "PullRequest": [(1,"C","First Pull"),(10,"B","Middle Puller"),(20,"A","High Puller"),(50,"AA","Hyper Puller"),(100,"AAA","Ultra Puller"),(200,"S","Super Puller"),(500,"SS","Deep Puller"),(1000,"SSS","God Puller")],
              "Reviews": [(1,"C","New Reviewer"),(3,"B","Intermediate Reviewer"),(8,"A","Active Reviewer"),(20,"AA","Hyper Reviewer"),(30,"AAA","Ultra Reviewer"),(45,"S","Super Reviewer"),(57,"SS","Deep Reviewer"),(70,"SSS","God Reviewer")],
              "Repositories": [(1,"C","First Repository"),(10,"B","Middle Repo Creator"),(20,"A","High Repo Creator"),(30,"AA","Hyper Repo Creator"),(35,"AAA","Ultra Repo Creator"),(40,"S","Super Repo Creator"),(45,"SS","Deep Repo Creator"),(50,"SSS","God Repo Creator")],
              "Experience": [(2,"C","Newbie"),(6,"B","Junior Dev"),(11,"A","Intermediate Dev"),(18,"AA","Experienced Dev"),(28,"AAA","Expert Dev"),(40,"S","Master Dev"),(55,"SS","Grandmaster"),(70,"SSS","Seasoned Veteran")],
              "Stars": [(1,"C","First Star"),(10,"B","Middle Star"),(30,"A","You are a Star"),(50,"AA","High Star"),(100,"AAA","Super Star"),(200,"S","Stargazer"),(700,"SS","High Stargazer"),(2000,"SSS","Super Stargazer")],
          }
          
          # Preenchido na montagem do workflow: ícones SVG da versão fixada acima.
          TROPHY_ICON_DATA = ""
          TROPHY_ICON_SHA256 = "4386ccb941096e94c12d8fddea0039fac04edd00284f80b61c9e6a5f7a18003a"
          
          
          def trophy_condition(category, value):
              profile_require(type(value) is int and value >= 0, "Valor inválido no troféu.")
              rules = TROPHY_RULES[category]
              reached = [rule for rule in rules if value >= rule[0]]
              if not reached:
                  goal = rules[0][0]
                  return {"rank": "?", "message": "Unknown", "progress": value / goal,
                          "next_threshold": goal, "level_progress": 0.0}
              threshold, level, message = reached[-1]
              next_rule = next((rule for rule in rules if rule[0] > value), None)
              level_progress = 1.0 if next_rule is None else (value - threshold) / (next_rule[0] - threshold)
              progress = 1.0 if next_rule is None else value / next_rule[0]
              return {"rank": level, "message": message, "progress": progress,
                      "next_threshold": next_rule[0] if next_rule else None,
                      "level_progress": level_progress}
          
          
          def trophy_rows(report):
              metrics, profile = report["metrics"], report["profile_totals"]
              definitions = [
                  ("Commits", "Commits", metrics["commits"], f"{metrics['commits']} commits"),
                  ("PullRequest", "Pull requests", metrics["prs"], f"{metrics['prs']} PRs"),
                  ("Reviews", "Reviews", profile["reviews"], f"{profile['reviews']} revisões"),
                  ("Repositories", "Repositórios", profile["owned_repositories"], f"{profile['owned_repositories']} repositórios"),
                  ("Experience", "Experience", profile["account_age_days"] // 100, f"{profile['account_age_days'] // 100}pt"),
                  ("Stars", "Estrelas", metrics["stars"], f"{metrics['stars']} estrelas"),
              ]
              rows = []
              for category, title, value, bottom in definitions:
                  row = {"category": category, "title": title, "score": value, "display_value": bottom,
                         **trophy_condition(category, value)}
                  row["display_message"] = row["message"]
                  rows.append(row)
              return rows
          
          
          def render_trophies(report):
              packed = base64.b64decode(TROPHY_ICON_DATA)
              profile_require(hashlib.sha256(packed).hexdigest() == TROPHY_ICON_SHA256, "Os ícones dos troféus foram alterados.")
              icons = json.loads(gzip.decompress(packed))
              rows = trophy_rows(report)
              root = ET.Element(profile_tag("svg"), {"width": "760", "height": "110", "viewBox": "0 0 760 110", "role": "img"})
              ET.SubElement(root, profile_tag("title")).text = "Conquistas ilustrativas calculadas com os dados auditados do GitHub"
              ET.SubElement(root, profile_tag("desc")).text = (
                  "Commits únicos de autoria principal nas branches acessíveis; PRs visíveis ao token; revisões nos últimos 365 dias; "
                  "repositórios próprios incluindo privados e forks; tempo desde a criação da conta; estrelas dos repositórios próprios. "
                  "As letras são classificações do gerador, não avaliações profissionais nem conquistas oficiais. "
                  "Barras: valor atual dividido pela próxima meta absoluta da categoria; 100% no nível máximo. "
                  "Consulta: " + report["consulted_at_utc"]
              )
              ET.SubElement(root, profile_tag("metadata")).text = TROPHY_SOURCE + "\n" + TROPHY_LICENSE
              for index, row in enumerate(rows):
                  panel = ET.SubElement(root, profile_tag("svg"), {"x": str(index * 130), "y": "0", "width": "110", "height": "110",
                              "viewBox": "0 0 110 110", "data-trophy": row["category"]})
                  # Subárvore original; as cores são as do tema algolia já utilizado.
                  wrapper = ET.fromstring('<svg xmlns="http://www.w3.org/2000/svg">' + icons[row["rank"]] + '</svg>')
                  for child in list(wrapper):
                      panel.append(child)
                  # Limita cada gradiente ao seu painel para evitar IDs duplicados.
                  old = row["rank"]
                  new = "trophy-" + row["category"] + "-gradient"
                  for node in panel.iter():
                      if node.get("id") == old:
                          node.set("id", new)
                      if node.get("fill") == "url(#" + old + ")":
                          node.set("fill", "url(#" + new + ")")
                  font = {"text-anchor": "middle", "font-family": "Segoe UI,Helvetica,Arial,sans-serif", "font-weight": "bold"}
                  ET.SubElement(panel, profile_tag("text"), dict(font, x="55", y="18", fill="#00aeff", **{"font-size": "13"})).text = row["title"]
                  ET.SubElement(panel, profile_tag("text"), dict(font, x="55", y="85", fill="#7eace9", **{"font-size": "10.5"})).text = row["display_message"]
                  ET.SubElement(panel, profile_tag("text"), dict(font, x="55", y="97", fill="#7eace9", **{"font-size": "10", "data-testid": "trophy-value"})).text = row["display_value"]
                  ET.SubElement(panel, profile_tag("rect"), {"x": "15", "y": "101", "width": "80", "height": "3.2", "rx": "1", "fill": "#00aeff", "opacity": "0.3"})
                  bar = ET.SubElement(panel, profile_tag("rect"), {"x": "15", "y": "101", "width": str(80 * row["progress"]), "height": "3.2", "rx": "1", "fill": "#00aeff", "data-testid": "trophy-progress"})
                  ET.SubElement(bar, profile_tag("title")).text = (f"{row['score']} / {row['next_threshold']} = {row['progress'] * 100:.2f}% da próxima meta" if row["next_threshold"] else "Nível máximo: 100%")
                  ET.SubElement(panel, profile_tag("title")).text = row["title"] + ": " + row["display_value"] + ". Classificação " + row["rank"]
              return root, rows
          
          
          def badge(label, value, color, icon=None):
              # Texto normal (não textLength): proporções estáveis e leitura legível.
              label_width = round(len(label) * 7.2 + (48 if icon else 22))
              value_width = round(len(str(value)) * 7.2 + 24)
              width = label_width + value_width
              root = ET.Element(profile_tag("svg"), {"width": str(width), "height": "28", "viewBox": f"0 0 {width} 28", "role": "img"})
              ET.SubElement(root, profile_tag("title")).text = f"{label}: {value}"
              ET.SubElement(root, profile_tag("rect"), {"width": str(label_width), "height": "28", "fill": "#30363d"})
              ET.SubElement(root, profile_tag("rect"), {"x": str(label_width), "width": str(value_width), "height": "28", "fill": color})
              if icon == "star":
                  ET.SubElement(root, profile_tag("path"), {"d": "M17 5l2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.2-4.3 2.2.8-4.8-3.5-3.4 4.8-.7z", "fill": "white", "transform": "translate(-2,2) scale(.85)"})
              if icon == "user":
                  ET.SubElement(root, profile_tag("circle"), {"cx": "15", "cy": "10", "r": "3", "fill": "white"})
                  ET.SubElement(root, profile_tag("path"), {"d": "M9 21v-3a6 6 0 0112 0v3z", "fill": "white"})
              common = {"y": "18", "text-anchor": "middle", "font-family": "DejaVu Sans,Verdana,sans-serif", "font-size": "10", "font-weight": "bold", "fill": "white", "letter-spacing": "0.5"}
              label_attrs = dict(common, x="34" if icon else str(label_width / 2))
              if icon:
                  label_attrs["text-anchor"] = "start"
              ET.SubElement(root, profile_tag("text"), label_attrs).text = label
              ET.SubElement(root, profile_tag("text"), dict(common, x=str(label_width + value_width / 2), **{"data-testid": "badge-value"})).text = str(value)
              return root
          
          
          def profile_assets(report):
              trophies, rows = render_trophies(report)
              profile = report["profile_totals"]
              stamp = datetime.fromisoformat(report["validated_at_utc"]).astimezone(ZoneInfo("America/Sao_Paulo"))
              updated = stamp.strftime("%d/%m/%Y %H:%M") + " BRT"
              values = {
                  "stars-badge.svg": ("ESTRELAS", report["metrics"]["stars"], "#488207", "star"),
                  "followers-badge.svg": ("SEGUIDORES", profile["followers"], "#236ad3", "user"),
                  "public-repos-badge.svg": ("REPOS PÚBLICOS", profile["public_repositories"], "#007ec6", None),
                  "private-repos-badge.svg": ("REPOS PRIVADOS", profile["private_repositories"], "#6f42c1", None),
                  "updated-badge.svg": ("ATUALIZADO", updated, "#238636", None),
              }
              roots = {"trophies.svg": trophies}
              for filename, (label, value, color, icon) in values.items():
                  roots[filename] = badge(label, value, color, icon)
              report["profile_assets"] = {
                  "trophy_source": TROPHY_SOURCE,
                  "trophies": rows,
                  "badges": {name: str(row[1]) for name, row in values.items()},
                  "updated_timezone": "America/Sao_Paulo",
                  "experience_rule": "floor(dias completos desde a criação da conta / 100), conforme o gerador original. Exibição em pontos inteiros, com sufixo pt; não mede experiência profissional nem anos de carreira.",
                  "reviews_period": report["periods"]["reviews"],
                  "bars_rule": "Valor atual / próxima meta absoluta da categoria. No nível máximo, 100%. level_progress registra separadamente o avanço relativo entre níveis, preservando a referência do gerador original.",
                  "views": "Komarev externo, separado desta auditoria; conta carregamentos, não visitantes únicos.",
              }
              validate_profile_assets(roots, report)
              report["validation"]["profile_assets_match"] = True
              return roots
          
          
          def validate_profile_assets(roots, report):
              # Conferência final do SVG com as fontes do relatório, sem confiar no texto renderizado.
              metrics, totals = report["metrics"], report["profile_totals"]
              expected = {"Commits": f"{metrics['commits']} commits", "PullRequest": f"{metrics['prs']} PRs",
                          "Reviews": f"{totals['reviews']} revisões", "Repositories": f"{totals['owned_repositories']} repositórios",
                          "Experience": f"{totals['account_age_days'] // 100}pt", "Stars": f"{metrics['stars']} estrelas"}
              panels = [e for e in roots["trophies.svg"].iter() if e.get("data-trophy")]
              profile_require(len(panels) == len(expected), "Troféu ausente ou duplicado.")
              for panel in panels:
                  name = panel.get("data-trophy")
                  profile_require(name in expected, "Troféu desconhecido.")
                  profile_require(profile_one(panel, "data-testid", "trophy-value").text == expected.pop(name), "Valor do troféu divergente.")
                  scores = {"Commits": metrics["commits"], "PullRequest": metrics["prs"], "Reviews": totals["reviews"],
                            "Repositories": totals["owned_repositories"], "Experience": totals["account_age_days"] // 100, "Stars": metrics["stars"]}
                  score = scores[name]
                  next_goals = [rule[0] for rule in TROPHY_RULES[name] if rule[0] > score]
                  expected_width = 80 * score / min(next_goals) if next_goals else 80
                  actual_width = float(profile_one(panel, "data-testid", "trophy-progress").get("width"))
                  profile_require(abs(actual_width - expected_width) < 1e-8, "Barra do troféu divergente: " + name)
              profile_require(not expected, "Troféus incompletos.")
              for name, expected_value in report["profile_assets"]["badges"].items():
                  profile_require(profile_one(roots[name], "data-testid", "badge-value").text == expected_value, "Badge divergente: " + name)
              profile_require(totals["owned_repositories"] == totals["public_repositories"] + totals["private_repositories"], "Totais públicos e privados não fecham.")
          
          
          
          
          def main():
              started = datetime.now(timezone.utc)
              api = API()
              identity, headers = api.get("/user")
              require(identity.get("login", "").lower() == USER, "O token pertence a outra conta.")
              scopes_header = next((v for k, v in headers.items() if k.lower() == "x-oauth-scopes"), "")
              scopes = {s.strip() for s in scopes_header.split(",")}
              require("repo" in scopes and bool({"read:user", "user"} & scopes), "Token classic precisa dos escopos repo e read:user.")
              repos = repository_inventory(api)
              owned = [r for r in repos.values() if r["owner"]["login"].lower() == USER]
              private_owned = sum(bool(r["private"]) for r in owned)
              require(private_owned == identity.get("owned_private_repos"), "Listagem incompleta de privados pessoais.")
              public_owned = sum(not r["private"] for r in owned)
              require(public_owned == identity.get("public_repos"), "Listagem incompleta de repositórios públicos próprios.")
              required = [n.strip() for n in os.environ.get("REQUIRED_PRIVATE_REPOS", "brasaliment/sistema-eventos").replace("\n", ",").split(",") if n.strip()]
              require(bool(required), "Lista obrigatória vazia.")
              for index, name in enumerate(required, 1):
                  require(bool(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", name)), f"Endereço inválido no item privado obrigatório {index}.")
                  try:
                      data, _ = api.get("/repos/" + name)
                  except RuntimeError as error:
                      raise RuntimeError(f"Privado obrigatório {index}: {error}") from None
                  require(data.get("full_name", "").lower() == name.lower() and data.get("private"), f"Item privado obrigatório {index} não confirmado.")
                  require(name.lower() in repos, f"Item privado obrigatório {index} ausente do inventário.")
              print(f"Privados pessoais conferidos: {private_owned}. Privados obrigatórios: {len(required)}.")
          
              commits = set()
              all_seen = set()
              unmatched = set()
              snapshots = {}
              language_from = started - timedelta(days=LANGUAGE_WINDOW_DAYS)
              active_repos = set()
              for index, (name, repo) in enumerate(sorted(repos.items()), 1):
                  heads = branch_snapshot(api, name)
                  snapshots[name] = heads
                  own, seen, unknown = commit_set(api, name, heads, language_from, started, active_repos)
                  commits.update(own)
                  all_seen.update(seen)
                  unmatched.update(unknown)
                  print(f"Repositório {index}/{len(repos)}: {len(heads)} branches verificadas.")
          
              # Dois caminhos de API para os bytes das linguagens.
              language_repos = [repos[name] for name in sorted(active_repos)]
              totals, languages_checked = language_totals(api, language_repos, all_repositories=True)
              graph_totals = language_totals_graphql(api, language_repos)
              require(graph_totals == totals, "Bytes de linguagens REST e GraphQL divergem. Execute novamente após estabilizar os dados.")
          
              period_from = started - timedelta(days=365)
              profile = api.graphql("""query($login:String!, $from:DateTime!, $to:DateTime!) {
                user(login:$login) {
                  followers {totalCount} pullRequests {totalCount} issues {totalCount}
                  repositoriesContributedTo(first:1,contributionTypes:[COMMIT,ISSUE,PULL_REQUEST,REPOSITORY]) {totalCount}
                  contributionsCollection(from:$from,to:$to) {totalPullRequestReviewContributions}
                }
              }""", {"login": USER, "from": period_from.isoformat(), "to": started.isoformat()})["user"]
              daily, years = calendar(api, identity["created_at"], started)
              streak = streaks(daily, started.date())
          
              # Se o inventário ou as branches avançarem, não misturar dois estados.
              final_inventory = repository_inventory(api)
              require(set(final_inventory) == set(repos), "Inventário mudou durante a coleta; execute novamente.")
              for name, heads in snapshots.items():
                  require(branch_snapshot(api, name) == heads, "Branches mudaram durante a auditoria; execute novamente.")
          
              metrics = {"commits": len(commits), "prs": integer(profile["pullRequests"]["totalCount"]),
                         "issues": integer(profile["issues"]["totalCount"]), "stars": sum(integer(r["stargazers_count"]) for r in owned),
                         "contribs": integer(profile["repositoriesContributedTo"]["totalCount"])}
              report = {
                  "schema_version": 9, "account": USER, "consulted_at_utc": started.isoformat(),
                  "private_access": {"owned_private_repositories_checked": private_owned,
                                     "required_private_repositories_checked": len(required),
                                     "accessible_private_repositories": sum(bool(r["private"]) for r in repos.values())},
                  "coverage": {"repositories_checked": len(repos), "branches_checked": sum(len(h) for h in snapshots.values()),
                               "unique_commit_objects_examined": len(all_seen), "unassociated_author_objects": len(unmatched),
                               "empty_repositories": sum(not h for h in snapshots.values()), "branch_heads_unchanged": True,
                               "repositories": "Todos os repositórios retornados por /user/repos para owner,collaborator,organization_member; inclui públicos, privados, forks e arquivados acessíveis.",
                               "commits": "Histórico alcançável nas branches existentes, SHAs globais únicos, autor principal associado pelo GitHub a lucasitdias. Merge commits incluídos. Coautorias, autoria sem associação, tags isoladas, refs de PR apagadas e commits não enviados não são contados.",
                               "limitations": "Acesso validado para privados pessoais e lista obrigatória; não comprova inexistência de outros projetos inacessíveis. APIs são consultadas em momentos distintos, não em transação atômica."},
                  "metrics": metrics,
                  "profile_totals": {
                      "owned_repositories": len(owned), "public_repositories": public_owned,
                      "private_repositories": private_owned,
                      "followers": integer(profile["followers"]["totalCount"]),
                      "reviews": integer(profile["contributionsCollection"]["totalPullRequestReviewContributions"]),
                      "account_created_at": identity["created_at"],
                      "account_age_days": integer(int((started - datetime.fromisoformat(identity["created_at"].replace("Z", "+00:00"))).total_seconds() // 86400)),
                  },
                  "periods": {"commits": "Todo o histórico alcançável nas branches auditadas, sem filtro de data",
                              "prs_and_issues": "Histórico visível ao token, sem filtro de data",
                              "stars": "Estrelas dos repositórios próprios na consulta inicial",
                              "contributed_repositories": "Semântica de repositoriesContributedTo do GitHub (último ano), não a contagem dos repositórios do inventário",
                              "reviews": {"from": period_from.isoformat(), "to": started.isoformat()},
                              "calendar": {"from": min(daily).isoformat(), "to": started.date().isoformat(), "timezone": "UTC"}},
                  "languages": {"repositories_checked": languages_checked, "bytes_by_language": dict(sorted(totals.items())),
                                "window_days": LANGUAGE_WINDOW_DAYS, "activity_from": language_from.isoformat(), "activity_to": started.isoformat(),
                                "owned_repositories": sum(r["owner"]["login"].lower() == USER for r in language_repos),
                                "other_owners_repositories": sum(r["owner"]["login"].lower() != USER for r in language_repos),
                                "private_repositories": sum(bool(r["private"]) for r in language_repos),
                                "forks": sum(bool(r["fork"]) for r in language_repos),
                                "rest_graphql_match": True,
                                "scope": "Repositórios acessíveis com ao menos um commit de autor principal associado a lucasitdias, pela data de autoria dentro dos últimos 180 dias, em qualquer branch auditada. Inclui próprios, outras contas, públicos, privados, forks e arquivados. Cada repositório conta uma vez; forks podem compartilhar código. Bytes atuais da branch padrão, incluindo código da equipe e anterior ao período. Não mede linhas escritas por Lucas nem bytes modificados em 180 dias. Top 8 normalizado sobre os bytes dessas 8 linguagens."},
                  "streak": streak, "calendar_years": years,
                  "calendar_days": {day.isoformat(): count for day, count in sorted(daily.items())},
                  "rank_validation": rank(metrics, integer(profile["contributionsCollection"]["totalPullRequestReviewContributions"]), integer(profile["followers"]["totalCount"])),
              }
              roots = {name: ET.parse(OUT / name).getroot() for name in ("stats.svg", "top-langs.svg", "streak.svg")}
              require(all(root.tag == tag("svg") for root in roots.values()), "Modelo SVG inválido.")
              draw_stats(roots["stats.svg"], report)
              report["languages"]["displayed"] = draw_languages(roots["top-langs.svg"], totals)
              draw_streak(roots["streak.svg"], streak, started)
              validate_rendered(roots, report, totals, daily, started.date())
              report["validated_at_utc"] = datetime.now(timezone.utc).isoformat()
              report["api_requests"] = api.requests
              report["validation"] = {"metrics_svg_match": True, "languages_svg_match": True, "streak_svg_match": True,
                                      "streak_independent_calculation_match": True, "annual_daily_sums_match": True}
              roots.update(profile_assets(report))
              for name, root in roots.items():
                  title = ET.SubElement(root, tag("title"))
                  title.text = "Consultado em " + started.isoformat() + ". Alcance em assets/stats/audit.json."
                  # Evita acúmulo de títulos em novas execuções.
                  for old in list(root.findall(tag("title")))[:-1]:
                      root.remove(old)
                  descs = root.findall(tag("desc"))
                  for old in descs[:-1]:
                      root.remove(old)
                  ET.ElementTree(root).write(OUT / name, encoding="utf-8", xml_declaration=True)
              (OUT / "audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print("Validação concluída. Métricas, bytes, percentuais, sequências e datas conferidos.")
              print("Totais agregados: " + json.dumps(metrics))
              print("Rank calculado: " + report["rank_validation"]["level"])
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write("## Auditoria concluída\n\n")
                      handle.write(f"Consultado em {started.isoformat()}. Calendário em UTC.\n\n")
                      handle.write("```json\n" + json.dumps(metrics, indent=2) + "\n```\n")
                      handle.write("Relatório agregado: assets/stats/audit.json. Layout preservado a partir dos SVGs existentes.\n")
          
          
          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:
                  print("::error::" + str(error))
                  sys.exit(1)
          PY

      - name: Publicar somente resultados validados
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/stats
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza estatísticas auditadas do perfil"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
