name: Atualizar estatísticas do perfil

on:
  workflow_dispatch:
  schedule:
      - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: cards-do-perfil
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório do perfil
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Auditar acesso privado e registrar períodos
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          REQUIRED_PRIVATE_REPOS: ${{ vars.STATS_REQUIRED_PRIVATE_REPOS || 'brasaliment/sistema-eventos' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          
          
          def api(path, payload=None):
              token = os.environ.get("PROFILE_STATS_TOKEN", "")
              if not token:
                  raise SystemExit("Configure o secret PROFILE_STATS_TOKEN.")
              request = Request(
                  "https://api.github.com" + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "profile-statistics-audit",
                  },
              )
              try:
                  with urlopen(request, timeout=60) as response:
                      headers = response.headers
                      data = json.load(response)
              except HTTPError as error:
                  raise SystemExit(
                      f"Consulta obrigatória falhou (HTTP {error.code}). "
                      "Confira o token, seu acesso aos privados e a autorização SSO."
                  ) from None
              if headers.get("X-GitHub-SSO"):
                  raise SystemExit("O GitHub indicou acesso SSO pendente ou parcial.")
              if isinstance(data, dict) and (data.get("errors") or data.get("incomplete_results")):
                  raise SystemExit("A API retornou erros ou resultados incompletos.")
              return data, headers
          
          
          user = "lucasitdias"
          identity, headers = api("/user")
          if identity.get("login", "").lower() != user:
              raise SystemExit("O token precisa pertencer à conta lucasitdias.")
          scopes = {scope.strip() for scope in headers.get("X-OAuth-Scopes", "").split(",")}
          if "repo" not in scopes or not ({"read:user", "user"} & scopes):
              raise SystemExit("O token classic precisa dos escopos repo e read:user.")
          
          repos = []
          page = 1
          while True:
              query = urlencode({
                  "visibility": "all",
                  "affiliation": "owner,collaborator,organization_member",
                  "per_page": 100,
                  "page": page,
              })
              batch, _ = api("/user/repos?" + query)
              if not isinstance(batch, list):
                  raise SystemExit("Resposta inválida ao listar repositórios.")
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          
          owned = [repo for repo in repos if repo["owner"]["login"].lower() == user]
          owned_private = [repo for repo in owned if repo["private"]]
          expected_private = identity.get("owned_private_repos")
          if expected_private is None or len(owned_private) != expected_private:
              raise SystemExit("Não foi possível comprovar a listagem completa dos privados pessoais.")
          if len(owned) > 100:
              raise SystemExit("O gerador de estrelas tem limite de 100 repositórios. Amplie-o antes de publicar.")
          
          required = os.environ.get("REQUIRED_PRIVATE_REPOS", "brasaliment/sistema-eventos")
          required = [name.strip() for name in required.replace("\n", ",").split(",") if name.strip()]
          if not required:
              raise SystemExit("Informe ao menos um repositório privado obrigatório.")
          for name in required:
              repo, _ = api("/repos/" + name)
              if repo.get("full_name", "").lower() != name.lower() or not repo.get("private"):
                  raise SystemExit("Um repositório obrigatório não foi confirmado como privado.")
          
          commits, _ = api("/search/commits?" + urlencode({"q": f"author:{user}"}))
          if commits.get("incomplete_results") is not False:
              raise SystemExit("A busca de commits não confirmou resultado completo.")
          commit_count = commits.get("total_count")
          if not isinstance(commit_count, int) or commit_count < 0:
              raise SystemExit("Total de commits inválido.")
          
          query = """
          query($login: String!) {
            user(login: $login) {
              followers { totalCount }
              reviews: contributionsCollection {
                totalPullRequestReviewContributions
                startedAt
                endedAt
              }
              pullRequests(first: 1) { totalCount }
              issues { totalCount }
              repositoriesContributedTo(first: 1, contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, REPOSITORY]) {
                totalCount
              }
              contributionsCollection {
                startedAt
                endedAt
                totalCommitContributions
                contributionCalendar { totalContributions }
              }
              repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                totalCount
                pageInfo { hasNextPage }
                nodes {
                  languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                    pageInfo { hasNextPage }
                  }
                }
              }
            }
          }
          """
          response, _ = api("/graphql", {"query": query, "variables": {"login": user}})
          data = response.get("data", {}).get("user")
          if not data:
              raise SystemExit("O GitHub não retornou os dados do perfil.")
          languages = data["repositories"]
          if languages["totalCount"] != sum(not repo["fork"] for repo in owned):
              raise SystemExit("REST e GraphQL retornaram conjuntos diferentes de repositórios próprios.")
          if languages["pageInfo"]["hasNextPage"] or any(
              node["languages"]["pageInfo"]["hasNextPage"] for node in languages["nodes"]
          ):
              raise SystemExit("O limite do gerador de linguagens omitiria dados. Publicação bloqueada.")
          
          period = data["contributionsCollection"]
          report = {
              "consulted_at_utc": datetime.now(timezone.utc).isoformat(),
              "account": user,
              "private_access": {
                  "owned_private_repositories_checked": len(owned_private),
                  "required_private_repositories_checked": len(required),
                  "accessible_private_repositories": sum(repo["private"] for repo in repos),
              },
              "metrics": {
                  "commits": commit_count,
                  "prs": data["pullRequests"]["totalCount"],
                  "issues": data["issues"]["totalCount"],
                  "stars": sum(repo["stargazers_count"] for repo in owned),
                  "contribs": data["repositoriesContributedTo"]["totalCount"],
              },
              "periods": {
                  "commits": "Busca author:lucasitdias, sem filtro de data, no índice visível ao token",
                  "prs_and_issues": "Histórico visível ao token, sem filtro de data",
                  "stars": "Estrelas atuais dos repositórios próprios visíveis ao token",
                  "contribution_calendar": {
                      "from": period["startedAt"],
                      "to": period["endedAt"],
                      "commits": period["totalCommitContributions"],
                      "contributions": period["contributionCalendar"]["totalContributions"],
                  },
                  "languages": "Bytes atuais dos repositórios próprios, públicos e privados, sem forks",
              },
              "rank_inputs": {
                  "all_commits": True,
                  "reviews": data["reviews"]["totalPullRequestReviewContributions"],
                  "followers": data["followers"]["totalCount"],
                  "reviews_from": data["reviews"]["startedAt"],
                  "reviews_to": data["reviews"]["endedAt"],
              },
              "coverage": (
                  "Privados pessoais comparados ao total informado pela API; "
                  "repositórios de organizações conferidos pela lista obrigatória. "
                  "A busca de commits depende da indexação do GitHub."
              ),
          }
          Path(".stats-audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Acesso privado, identidade, escopos, paginação e períodos conferidos.")
          PY

      - name: Gerar estatísticas gerais
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be
        with:
          card: stats
          options: username=lucasitdias&show_icons=true&theme=highcontrast&include_all_commits=true&number_format=long&hide_border=true&border_radius=12&locale=pt-br
          path: assets/stats/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Gerar linguagens mais usadas
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be
        with:
          card: top-langs
          options: username=lucasitdias&layout=compact&langs_count=8&theme=chartreuse-dark&hide_border=true&border_radius=12&locale=pt-br
          path: assets/stats/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Gerar sequência de contribuições
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=lucasitdias&theme=highcontrast&hide_border=true&border_radius=12&locale=pt_BR&disable_animations=true
          path: assets/stats/streak.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Validar os painéis contra a auditoria
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          
          
          def calculate_rank(metrics, rank_inputs):
              inputs = {
                  "commits": metrics["commits"],
                  "prs": metrics["prs"],
                  "issues": metrics["issues"],
                  "stars": metrics["stars"],
                  "reviews": rank_inputs["reviews"],
                  "followers": rank_inputs["followers"],
              }
              if any(type(value) is not int or value < 0 for value in inputs.values()):
                  raise SystemExit("Dados inválidos para recalcular o rank.")
              commit_median = 1000 if rank_inputs["all_commits"] else 250
              weighted = (
                  2 * (1 - 2 ** (-inputs["commits"] / commit_median))
                  + 3 * (1 - 2 ** (-inputs["prs"] / 50))
                  + (1 - 2 ** (-inputs["issues"] / 25))
                  + (1 - 2 ** (-inputs["reviews"] / 2))
                  + 4 * inputs["stars"] / (inputs["stars"] + 50)
                  + inputs["followers"] / (inputs["followers"] + 10)
              )
              score = (1 - weighted / 12) * 100
              thresholds = [1, 12.5, 25, 37.5, 50, 62.5, 75, 87.5, 100]
              levels = ["S", "A+", "A", "A-", "B+", "B", "B-", "C+", "C"]
              level = next(level for limit, level in zip(thresholds, levels) if score <= limit)
              return {"level": level, "formula_score": score, "inputs": inputs}
          
          audit = json.loads(Path(".stats-audit.json").read_text(encoding="utf-8"))
          error_markers = (
              "something went wrong", "resource not accessible", "maximum retries",
              "bad credentials", "api rate limit", "could not fetch", "user not found",
          )
          roots = {}
          for name in ("stats.svg", "top-langs.svg", "streak.svg"):
              path = Path("assets/stats") / name
              root = ET.parse(path).getroot()
              text = " ".join(root.itertext()).lower()
              if root.tag != "{http://www.w3.org/2000/svg}svg" or not text.strip():
                  raise SystemExit(f"SVG inválido: {name}")
              if any(marker in text for marker in error_markers) or any(
                  element.get("data-testid") == "message" for element in root.iter()
              ):
                  raise SystemExit(f"Erro no painel {name}; publicação bloqueada.")
              roots[name] = root
          
          for metric, expected in audit["metrics"].items():
              elements = [element for element in roots["stats.svg"].iter() if element.get("data-testid") == metric]
              if len(elements) != 1:
                  raise SystemExit(f"Não foi possível conferir a métrica {metric}.")
              raw = "".join(elements[0].itertext()).strip()
              compact = raw.replace("\u00a0", "").replace("\u202f", "")
              if compact.isascii() and compact.isdecimal():
                  actual = int(compact)
              elif re.fullmatch(r"[0-9]{1,3}(?:,[0-9]{3})+", compact):
                  actual = int(compact.replace(",", ""))
              else:
                  raise SystemExit(f"Formato inesperado na métrica {metric}: {raw!r}.")
              print(f"Conferência {metric}: auditoria={expected}; painel={actual}.")
              if actual != expected and metric == "commits":
                  token = os.environ.get("PROFILE_STATS_TOKEN", "")
                  if not token:
                      raise SystemExit("Token ausente para reconferir a divergência de commits.")
                  request = Request(
                      "https://api.github.com/search/commits?" + urlencode({"q": "author:lucasitdias"}),
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "User-Agent": "profile-statistics-audit",
                      },
                  )
                  with urlopen(request, timeout=60) as response:
                      if response.headers.get("X-GitHub-SSO"):
                          raise SystemExit("Acesso SSO parcial na reconferência de commits.")
                      fresh = json.load(response)
                  if fresh.get("incomplete_results") is not False or fresh.get("errors"):
                      raise SystemExit("Reconferência de commits incompleta; publicação bloqueada.")
                  latest = fresh.get("total_count")
                  if not isinstance(latest, int) or latest < 0:
                      raise SystemExit("Total inválido na reconferência de commits.")
                  print(f"Reconferência commits: API={latest}; painel={actual}.")
                  if actual == latest:
                      audit["commits_recheck"] = {
                          "initial_count": expected,
                          "confirmed_count": latest,
                          "consulted_at_utc": datetime.now(timezone.utc).isoformat(),
                      }
                      audit["metrics"]["commits"] = latest
                      expected = latest
              if actual != expected:
                  raise SystemExit(
                      f"A métrica {metric} divergiu: auditoria={expected}; painel={actual}. "
                      "Publicação bloqueada; investigue a consulta e o período antes de aceitar os dados."
                  )
          
          rank = calculate_rank(audit["metrics"], audit["rank_inputs"])
          rank_elements = [
              element for element in roots["stats.svg"].iter()
              if element.get("data-testid") == "level-rank-icon"
          ]
          if len(rank_elements) != 1:
              raise SystemExit("O rank não pôde ser identificado no SVG.")
          displayed_rank = "".join(rank_elements[0].itertext()).strip()
          print(f"Conferência rank: recalculado={rank['level']}; painel={displayed_rank}.")
          if displayed_rank != rank["level"]:
              raise SystemExit("O rank do painel divergiu do recálculo; publicação bloqueada.")
          rank["formula_source"] = (
              "https://github.com/stats-organization/github-readme-stats/blob/"
              "d79be7a9fd50ce38aef89306c8a1185fc0443bc7/src/calculateRank.js"
          )
          audit["rank_validation"] = rank
          
          stats_path = Path("assets/stats/stats.svg")
          stats_text = stats_path.read_text(encoding="utf-8")
          stats_text = re.sub(r"Total de Commits\s*:", "Commits indexados:", stats_text)
          stats_path.write_text(stats_text, encoding="utf-8")
          
          audit["validated_at_utc"] = datetime.now(timezone.utc).isoformat()
          Path("assets/stats/audit.json").write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print("Os cinco totais do painel coincidem com a consulta autenticada de auditoria.")
          print("A letra do rank coincide com a fórmula da versão fixada do gerador.")
          print("A validação dos painéis de linguagens e sequência confere formato e mensagens de erro.")
          PY

      - name: Publicar as estatísticas
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/stats

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza estatísticas do perfil"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
