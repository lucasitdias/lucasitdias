name: Atualizar cards de projetos

on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'

permissions:
  contents: write

concurrency:
  group: cards-do-perfil
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório do perfil
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Gerar os cards e atualizar o README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from html import escape
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          user = "lucasitdias"
          limit = 6
          start = "<!-- PROJECT_CARDS:START -->"
          end = "<!-- PROJECT_CARDS:END -->"
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          if content.count(start) != 1 or content.count(end) != 1:
              raise SystemExit("O README precisa de um único par de marcadores PROJECT_CARDS.")

          before, _, remainder = content.partition(start)
          _, separator, after = remainder.partition(end)
          if not separator:
              raise SystemExit("Os marcadores PROJECT_CARDS estão fora de ordem.")

          repos = []
          page = 1
          while len(repos) < limit:
              query = urlencode({
                  "type": "owner",
                  "sort": "pushed",
                  "direction": "desc",
                  "per_page": 100,
                  "page": page,
              })
              request = Request(
                  f"https://api.github.com/users/{user}/repos?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  batch = json.load(response)

              repos.extend(
                  repo for repo in batch
                  if repo["name"].lower() != user
                  and not repo["fork"]
                  and not repo["archived"]
              )
              if len(batch) < 100:
                  break
              page += 1

          repos = repos[:limit]
          if not repos:
              raise SystemExit("Nenhum projeto elegível encontrado. Cards atuais preservados.")

          cards_dir = Path("assets/project-cards")
          cards_dir.mkdir(parents=True, exist_ok=True)

          rows = []
          for index in range(0, len(repos), 2):
              pair = repos[index:index + 2]
              cells = []
              for offset, repo in enumerate(pair):
                  repo_name = repo["name"]
                  name = escape(repo_name, quote=True)
                  link = escape(repo["html_url"], quote=True)
                  import textwrap

                  titles = {
                      "whisper_desktop": "Whisper Transcriber",
                      "cosulta-cnpj": "Consulta CNPJ",
                      "desafio-tecnico-berna": "Desafio Técnico Berna",
                      "cinelogplay-web": "CineLogPlay",
                      "computer-science-studies": "Ciência da Computação",
                      "app-compras-android": "TechStore Android",
                  }

                  title = titles.get(
                      repo_name,
                      repo_name.replace("_", " ").replace("-", " ").title(),
                  )
                  title = escape(textwrap.shorten(
                      title, width=28, placeholder="…"
                  ))

                  description = " ".join(
                      (repo.get("description") or
                       "Código-fonte e documentação disponíveis no repositório.").split()
                  )
                  description = textwrap.shorten(
                      description, width=88, placeholder="…"
                  )
                  description_lines = textwrap.wrap(
                      description, width=44
                  )[:2]

                  description_svg = "".join(
                      f'<text x="22" y="{88 + line_index * 20}"'
                      ' fill="#aab4c3" font-family="Arial, sans-serif"'
                      f' font-size="13">{escape(line)}</text>'
                      for line_index, line in enumerate(description_lines)
                  )

                  language = escape(repo.get("language") or "Código-fonte")
                  stars = int(repo.get("stargazers_count", 0))
                  forks = int(repo.get("forks_count", 0))
                  card_path = cards_dir / f"project-{index + offset + 1}.svg"

                  card_path.write_text(
                      '<svg xmlns="http://www.w3.org/2000/svg"'
                      ' width="400" height="172" viewBox="0 0 400 172">'
                      '<defs>'
                      '<linearGradient id="background" x2="1" y2="1">'
                      '<stop stop-color="#172131"/>'
                      '<stop offset="1" stop-color="#0e151f"/>'
                      '</linearGradient>'
                      '</defs>'
                      '<rect x="1" y="1" width="398" height="170"'
                      ' rx="14" fill="url(#background)" stroke="#303d50"/>'
                      '<rect x="22" y="21" width="34" height="34"'
                      ' rx="9" fill="#233650"/>'
                      '<text x="39" y="43" text-anchor="middle"'
                      ' fill="#8bbcff" font-family="monospace"'
                      ' font-size="16" font-weight="bold">&lt;/&gt;</text>'
                      '<text x="68" y="43" fill="#edf3fc"'
                      ' font-family="Arial, sans-serif"'
                      f' font-size="17" font-weight="bold">{title}</text>'
                      f'{description_svg}'
                      '<path d="M22 129H378" stroke="#293547"/>'
                      '<circle cx="27" cy="150" r="4" fill="#70c4b5"/>'
                      '<text x="39" y="154" fill="#c3d0df"'
                      f' font-family="Arial, sans-serif" font-size="12">{language}</text>'
                      '<text x="378" y="154" text-anchor="end"'
                      ' fill="#92a2b8" font-family="Arial, sans-serif"'
                      f' font-size="11">Estrelas {stars} · Forks {forks}</text>'
                      '</svg>\n',
                      encoding="utf-8",
                  )
                      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100"'
                      ' viewBox="0 0 400 100">'
                      '<rect x="1" y="1" width="398" height="98" rx="10"'
                      ' fill="#0d1117" stroke="#30363d"/>'
                      '<text x="20" y="39" fill="#7fff00"'
                      ' font-family="monospace" font-size="17" font-weight="bold">'
                      f'{short_name}</text>'
                      '<text x="20" y="71" fill="#c9d1d9"'
                      f' font-family="sans-serif" font-size="14">{language}</text>'
                      '</svg>\n',
                      encoding="utf-8",
                  )

                  layout = 'colspan="2"' if len(pair) == 1 else 'width="50%"'
                  cells.append(
                      f'  <td {layout} align="center">\n'
                      f'    <a href="{link}">\n'
                      f'      <img width="400" src="./{card_path.as_posix()}" alt="{name}" />\n'
                      f'    </a>\n'
                      f'  </td>'
                  )

              rows.append("<tr>\n" + "\n".join(cells) + "\n</tr>")

          for slot in range(len(repos) + 1, limit + 1):
              (cards_dir / f"project-{slot}.svg").unlink(missing_ok=True)

          updated = f"{before}{start}\n\n" + "\n\n".join(rows) + f"\n\n{end}{after}"
          readme.write_text(updated, encoding="utf-8")
          PY

      - name: Publicar os cards e o README
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md assets/project-cards

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza cards dos projetos"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
