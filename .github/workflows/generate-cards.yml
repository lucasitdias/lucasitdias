name: Generate Repo Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install @octokit/rest

      - name: Generate SVG
        run: |
          mkdir -p assets
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100">
          <rect width="100%" height="100%" fill="#0d1117"/>
          <text x="50%" y="50%" fill="white" dominant-baseline="middle" text-anchor="middle">
          Repo cards working
          </text>
          </svg>' > assets/test.svg

      - name: Commit file
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add assets/test.svg
          git commit -m "generate svg" || echo "no changes"
          git push
