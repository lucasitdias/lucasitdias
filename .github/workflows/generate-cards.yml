name: Generate Repo Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # roda todo dia às 03h UTC (~00h no Brasil)

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate SVG cards
        run: node generate-cards.js

      - name: Commit files
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add assets/*.svg
          git commit -m "update repo cards" || echo "no changes"
          git pull --rebase origin main || true
          git push
