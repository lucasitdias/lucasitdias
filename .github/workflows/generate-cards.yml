name: Generate Repo Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # roda todo dia às 03h UTC

permissions:
  contents: write
  workflows: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate SVG cards
        run: node generate-cards.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add assets/*.svg README.md

          git diff --cached --quiet || git commit -m "update repo cards"

      - name: Push changes
        run: git push
